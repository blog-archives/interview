<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="3500" viewBox="0 0 2200 3500">
<defs>
<style>
text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#172235}.title{font-size:44px;font-weight:700}.sub{font-size:23px;fill:#5c7189}.h{font-size:25px;font-weight:700}.b{font-size:21px}.s{font-size:18px;fill:#566a80}.e{font-size:18px;fill:#53677c;font-weight:600}.mono{font-family:Menlo,Consolas,monospace;font-size:18px;fill:#324d6a}.inv{fill:#fff}.panel{fill:none;stroke:#c8d5e3;stroke-width:2;stroke-dasharray:10 8}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.blue{fill:#eaf3ff;stroke:#3973b9}.green{fill:#eaf8f1;stroke:#35865e}.orange{fill:#fff3e5;stroke:#c76a23}.purple{fill:#f2edff;stroke:#7656b4}.red{fill:#fff0f0;stroke:#c85555}.dec{fill:#fff7df;stroke:#d29a23;stroke-width:2}.line{fill:none;stroke:#72869c;stroke-width:3;marker-end:url(#a)}.dline{fill:none;stroke:#c76a23;stroke-width:3;stroke-dasharray:10 7;marker-end:url(#ao)}
</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#72869c"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c76a23"/></marker>
</defs>
<rect width="2200" height="3500" fill="#f7f9fc"/>
<text x="1100" y="62" text-anchor="middle" class="title">接口突然变慢：从现象到根因的排查决策树</text><text x="1100" y="101" text-anchor="middle" class="sub">先确认“慢在哪里”，再判断“为什么慢”；每一步都要用证据验证假设</text>

<rect x="690" y="145" width="820" height="78" rx="39" fill="#173f70"/><text x="1100" y="195" text-anchor="middle" font-size="29" font-weight="700" class="inv">用户反馈：接口 / 网页突然变慢</text>
<path class="line" d="M1100 223V270"/><polygon class="dec" points="1100,270 1350,340 1100,410 850,340"/><text x="1100" y="333" text-anchor="middle" class="h">先确认：慢的是后端吗？</text><text x="1100" y="365" text-anchor="middle" class="b">DevTools 看 TTFB；curl 对比总耗时、首字节和下载</text>
<path class="line" d="M1100 410V455"/><text x="1140" y="442" class="e">是：进入服务排查</text><text x="1375" y="345" class="e">否</text><text x="1375" y="375" class="s">转前端 / CDN / DNS / 网络</text>

<rect class="panel" x="55" y="500" width="2090" height="700" rx="28"/><text x="90" y="540" class="h" fill="#254c79">第一段：观测条件决定“定位精度”和“中间动作”</text>
<polygon class="dec" points="1100,455 1260,505 1100,555 940,505"/><text x="1100" y="513" text-anchor="middle" class="h">手上有什么证据？</text>
<path class="line" d="M1020 530V590H390V635"/><path class="line" d="M1100 555V635"/><path class="line" d="M1180 530V590H1810V635"/>
<text x="510" y="580" class="e">有监控 + Trace</text><text x="1010" y="610" class="e">无监控，但有日志</text><text x="1590" y="580" class="e">监控、日志都没有</text>

<rect class="blue" x="90" y="635" width="600" height="300" rx="22"/><text x="125" y="680" class="h">A｜监控 + Trace</text><text x="125" y="725" class="b"><tspan x="125">1. Grafana 看 RT / P95 / P99、QPS、错误率</tspan><tspan x="125" dy="36">2. 下钻到服务、实例、时间窗</tspan><tspan x="125" dy="36">3. Trace 找具体慢 span：RPC / SQL / Redis</tspan><tspan x="125" dy="36">结论：通常能拿到“服务 + Pod + 慢分段”</tspan></text>
<rect class="green" x="800" y="635" width="600" height="300" rx="22"/><text x="835" y="680" class="h">B｜只有日志</text><text x="835" y="725" class="b"><tspan x="835">1. 有错误：看异常堆栈和上下文</tspan><tspan x="835" dy="36">2. 只是慢：筛 latency / request_time</tspan><tspan x="835" dy="36">3. 用 request_id / trace_id 串请求</tspan><tspan x="835" dy="36">结论：字段完整可到 Pod；否则可能只有服务级</tspan></text>
<rect class="orange" x="1510" y="635" width="600" height="300" rx="22"/><text x="1545" y="680" class="h">C｜什么都没有</text><text x="1545" y="725" class="b"><tspan x="1545">1. 先复现，确认是服务整体慢</tspan><tspan x="1545" dy="36">2. 逐 Pod / 节点看基础状态和资源</tspan><tspan x="1545" dy="36">3. 对比实例、谨慎摘流，或临时补日志 / Trace</tspan><tspan x="1545" dy="36">结论：先拿到“候选 Pod”，再谈内部根因</tspan></text>
<path class="line" d="M390 935V1015H1100"/><path class="line" d="M1100 935V1015"/><path class="line" d="M1810 935V1015H1100"/><rect class="green" x="650" y="1015" width="900" height="110" rx="22"/><text x="1100" y="1060" text-anchor="middle" class="h">形成排查对象</text><text x="1100" y="1094" text-anchor="middle" class="b">服务 + 时间窗 + 候选 Pod（可能还没有具体慢分段）</text>

<path class="line" d="M1100 1125V1265"/><rect x="620" y="1265" width="960" height="78" rx="20" fill="#173f70"/><text x="1100" y="1315" text-anchor="middle" font-size="28" font-weight="700" class="inv">第二段：资源异常是否能解释 RT？</text>
<rect class="panel" x="70" y="1375" width="2060" height="1110" rx="28"/><text x="105" y="1415" class="h">先看资源，但不要把“资源异常”直接当成根因</text>

<rect class="blue" x="300" y="1460" width="1600" height="150" rx="20"/><text x="345" y="1505" class="h">资源层：CPU、内存 / GC、IO / 网络、连接数</text><text x="345" y="1545" class="b">先对齐慢请求时间窗，再看 Pod / Node 的指标是否异常；命令速查见配套文档</text><text x="345" y="1582" class="s">异常只说明“值得深入”，还要判断是代码造成，还是依赖变慢造成的连锁反应</text>
<path class="line" d="M1100 1610V1660"/><polygon class="dec" points="1100,1660 1270,1715 1100,1770 930,1715"/><text x="1100" y="1723" text-anchor="middle" class="h">资源指标异常？</text>

<path class="line" d="M930 1715H250V1840"/><text x="270" y="1700" class="e">CPU 高 / 内存高 / GC 异常</text><rect class="red" x="80" y="1840" width="520" height="230" rx="20"/><text x="115" y="1883" class="h">资源异常 → 进程画像</text><text x="115" y="1925" class="b"><tspan x="115">CPU：CPU profile 找热点函数</tspan><tspan x="115" dy="34">内存 / GC：heap、allocs、GC 指标</tspan><tspan x="115" dy="34">看到共同热点，才回到代码验证</tspan></text>
<path class="line" d="M930 1715H690V1840"/><text x="700" y="1700" class="e">goroutine / 等待迹象</text><rect class="purple" x="630" y="1840" width="520" height="230" rx="20"/><text x="665" y="1883" class="h">资源异常 → 等待分析</text><text x="665" y="1925" class="b"><tspan x="665">goroutine stack 看共同阻塞点</tspan><tspan x="665" dy="34">block / mutex 看等待和竞争</tspan><tspan x="665" dy="34">若卡在连接 / 下游，转依赖层</tspan></text>
<path class="line" d="M1270 1715H1510V1840"/><text x="1370" y="1700" class="e">IO / 网络 / 连接异常</text><rect class="orange" x="1220" y="1840" width="520" height="230" rx="20"/><text x="1255" y="1883" class="h">资源异常 → 依赖线索</text><text x="1255" y="1925" class="b"><tspan x="1255">iostat / ss 看等待和连接状态</tspan><tspan x="1255" dy="34">连接池等待是否持续增加？</tspan><tspan x="1255" dy="34">继续查 MySQL / Redis / RPC</tspan></text>
<path class="line" d="M1270 1715H1950V1840"/><text x="1840" y="1700" class="e">无显著异常</text><rect class="green" x="1780" y="1840" width="340" height="230" rx="20"/><text x="1815" y="1883" class="h">仍然慢？</text><text x="1815" y="1925" class="b"><tspan x="1815">资源正常不代表</tspan><tspan x="1815" dy="34">服务正常</tspan><tspan x="1815" dy="34">进入 Trace / 进程 / 依赖</tspan></text>

<path class="line" d="M340 2070V2150H1100"/><path class="line" d="M890 2070V2150H1100"/><path class="line" d="M1480 2070V2150H1100"/><path class="line" d="M1950 2070V2150H1100"/>
<rect x="610" y="2150" width="980" height="92" rx="22" fill="#173f70"/><text x="1100" y="2207" text-anchor="middle" font-size="27" font-weight="700" class="inv">第三段：进程、依赖、代码之间允许回溯</text>

<rect class="panel" x="55" y="2280" width="2090" height="1000" rx="28"/><text x="90" y="2320" class="h">典型分支：现象 → 假设 → 验证 → 根因（不是单向直线）</text>
<!-- four example columns -->
<g transform="translate(85 2370)"><rect class="red" width="480" height="78" rx="18"/><text x="240" y="50" text-anchor="middle" class="h">CPU 暴涨</text><path class="line" d="M240 78V105"/><rect class="box" y="105" width="480" height="145" rx="18"/><text x="25" y="145" class="b"><tspan font-weight="700">假设：</tspan>热点计算 / 死循环 / GC / 重试</text><text x="25" y="185" class="s">可能是代码，也可能是下游变慢后重试放大</text><path class="line" d="M240 250V277"/><rect class="purple" y="277" width="480" height="150" rx="18"/><text x="25" y="317" class="b" font-weight="700">验证：CPU profile + heap / GC</text><text x="25" y="357" class="s">热点明确 → 查代码；热点不明确 → 查依赖和重试</text></g>
<g transform="translate(595 2370)"><rect class="red" width="480" height="78" rx="18"/><text x="240" y="50" text-anchor="middle" class="h">goroutine 堆积</text><path class="line" d="M240 78V105"/><rect class="box" y="105" width="480" height="145" rx="18"/><text x="25" y="145" class="b"><tspan font-weight="700">假设：</tspan>泄漏 / 等锁 / 等连接 / 等下游</text><text x="25" y="185" class="s">数量持续增长且请求下降后不回落，才像泄漏</text><path class="line" d="M240 250V277"/><rect class="purple" y="277" width="480" height="150" rx="18"/><text x="25" y="317" class="b" font-weight="700">验证：goroutine stack + block / mutex</text><text x="25" y="357" class="s">共同卡在连接或 RPC → 转依赖层</text></g>
<g transform="translate(1105 2370)"><rect class="red" width="480" height="78" rx="18"/><text x="240" y="50" text-anchor="middle" class="h">连接池打满</text><path class="line" d="M240 78V105"/><rect class="box" y="105" width="480" height="145" rx="18"/><text x="25" y="145" class="b"><tspan font-weight="700">假设：</tspan>QPS 变大，或单连接占用变长</text><text x="25" y="185" class="s">慢 SQL、长事务、锁等待、下游变慢、连接泄漏</text><path class="line" d="M240 250V277"/><rect class="green" y="277" width="480" height="150" rx="18"/><text x="25" y="317" class="b" font-weight="700">验证：池等待 + QPS + SQL / RPC RT</text><text x="25" y="357" class="s">依赖证据不足 → 回到进程 stack 或代码生命周期</text></g>
<g transform="translate(1615 2370)"><rect class="red" width="480" height="78" rx="18"/><text x="240" y="50" text-anchor="middle" class="h">CPU 不高但 RT 高</text><path class="line" d="M240 78V105"/><rect class="box" y="105" width="480" height="145" rx="18"/><text x="25" y="145" class="b"><tspan font-weight="700">假设：</tspan>IO / 网络 / 锁竞争 / 请求排队</text><text x="25" y="185" class="s">不要因为 CPU 正常就排除依赖问题</text><path class="line" d="M240 250V277"/><rect class="green" y="277" width="480" height="150" rx="18"/><text x="25" y="317" class="b" font-weight="700">验证：Trace 分段 + iostat / stack</text><text x="25" y="357" class="s">慢 span 明确 → 查对应 MySQL / Redis / RPC</text></g>

<path class="line" d="M1100 3280V3330"/><polygon class="dec" points="1100,3330 1260,3380 1100,3430 940,3380"/><text x="1100" y="3388" text-anchor="middle" class="h">证据支持假设？</text><path class="dline" d="M940 3380H35V1500H300"/><text x="55" y="3360" class="e" fill="#c76a23">否：提出新假设，回到资源 / 进程 / 依赖</text><path class="line" d="M1260 3380H1500"/><rect class="green" x="1500" y="3335" width="610" height="90" rx="22"/><text x="1805" y="3372" text-anchor="middle" class="h">根因确认 → 修复 / 限流 / 扩容 / 降级 / 回滚</text><text x="1805" y="3407" text-anchor="middle" class="s">回归验证 RT / P99、错误率、资源与池等待</text>
</svg>
